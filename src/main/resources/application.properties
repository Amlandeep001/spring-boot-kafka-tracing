server.port=9777
spring.application.name=kafka-tracing
spring.kafka.bootstrap-servers=localhost:9092
# Sleuth & Zipkin
#spring.sleuth.integration.enabled=true
#spring.zipkin.base-url=http://localhost:9411/
#spring.sleuth.sampler.probability=1

#management.endpoints.web.exposure.include=*
#management.endpoint.health.show-details=always
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
#management.zipkin.tracing.connect-timeout=60s
#management.zipkin.tracing.encoding=json
#management.zipkin.tracing.export.enabled=true
management.tracing.sampling.probability=1.0

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
#logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false
logging.pattern.correlation=

kafka.tracing.example-topic=example-topic
spring.kafka.consumer.group-id=example-group


#spring.kafka.producer.interceptor-classes=com.org.springboot.kafkaTracing.config.KafkaTracingProducerInterceptor
#spring.kafka.consumer.interceptor-classes=com.org.springboot.kafkaTracing.config.KafkaTracingConsumerInterceptor

spring.output.ansi.enabled=ALWAYS